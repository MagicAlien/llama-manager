# llama.cpp Manager — CI
#
# T-000: the six gates. `windows-latest` ships Rust, Node and the MSVC build
# tools (docs/DEV-SETUP.md §CI), so nothing is installed beyond the rustfmt
# and clippy components and cached dependencies.
#
# `jobs.gates` is deliberately reusable: later tasks add steps to it (T-002
# adds the type-generation freshness check) rather than forking the workflow.
#
# `jobs.demo-failure` proves the gates' red path on demand: label a PR
# `demo:failure` and the same six commands run against a deliberately broken
# tree, expecting every one of them to fail. It never runs otherwise.
name: CI

on:
  pull_request:
    # `labeled` and `unlabeled` beyond the defaults: the demo-failure job is
    # gated on the demo:failure label, so label changes must re-run CI.
    types: [opened, synchronize, reopened, labeled, unlabeled]
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  gates:
    name: Build, test, lint
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Pinned to match rust-toolchain.toml (T-001). Once that file exists it
      # overrides this action's toolchain for every cargo invocation anyway;
      # pinning the action to the same version means the two cannot disagree,
      # instead of the action silently losing to the file (PROGRESS.md D-006).
      - name: Install Rust (with clippy and rustfmt)
        uses: dtolnay/rust-toolchain@1.88
        with:
          components: clippy, rustfmt

      # actions/cache only saves on a miss (T-000 Observations): a bare
      # Cargo.toml/Cargo.lock hash key means every push that doesn't change
      # dependencies restores the *first* run's target/ forever and never
      # saves the fuller incremental build a later run produced. Invisible
      # on T-000's dependency-free crate; from T-001 (real deps: Tauri and
      # friends) it means the cache stops doing its job. The run_id suffix
      # makes every run a miss, so it always saves at the end; restore-keys
      # still finds the closest previous cache by falling back to the
      # dependency-hash prefix.
      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('src-tauri/Cargo.toml', 'src-tauri/Cargo.lock') }}-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-cargo-${{ hashFiles('src-tauri/Cargo.toml', 'src-tauri/Cargo.lock') }}-

      - name: Cache npm
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('package-lock.json') }}

      # Rust gates -----------------------------------------------------------
      - name: cargo fmt --check
        run: cargo fmt --check
        working-directory: src-tauri

      - name: cargo build
        run: cargo build
        working-directory: src-tauri

      - name: cargo clippy -- -D warnings
        run: cargo clippy -- -D warnings
        working-directory: src-tauri

      - name: cargo test
        run: cargo test
        working-directory: src-tauri

      # JavaScript gates -----------------------------------------------------
      - name: npm ci
        run: npm ci

      # T-002: src/lib/types.ts is generated from src-tauri/src/core/types.rs
      # (docs/CONTRACTS.md §1) via ts-rs; AGENTS.md invariant 9 says it is
      # never hand-edited, so the only way that invariant holds is a gate
      # that regenerates it and fails on any diff. `npm run generate-types`
      # itself runs `cargo test export_bindings` (scripts/generate-types.mjs)
      # — this step depends on the Rust toolchain installed above, which is
      # why it runs here rather than earlier alongside `npm ci`.
      - name: Check src/lib/types.ts is fresh
        shell: pwsh
        run: |
          npm run generate-types
          git diff --exit-code -- src/lib/types.ts
          if ($LASTEXITCODE -ne 0) {
            Write-Output "src/lib/types.ts is stale — run 'npm run generate-types' and commit the result."
            exit 1
          }

      # Uploaded unconditionally, not just on failure: this is the byte-exact
      # output of the real generator on the real toolchain, which is worth
      # having on hand even on a green run. It exists specifically because a
      # pasted `git diff` in a chat log has already twice failed to convey
      # exact whitespace (trailing spaces, line endings) accurately enough
      # to reproduce by hand — see PROGRESS.md, T-002. Download this
      # artifact and use it directly instead of re-deriving it from a diff.
      - name: Upload generated src/lib/types.ts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: generated-types-ts
          path: src/lib/types.ts
          retention-days: 14

      - name: npm run lint
        run: npm run lint

      - name: npm run test
        run: npm run test

  demo-failure:
    name: Demonstrate the gates fail (label demo:failure)
    if: contains(github.event.pull_request.labels.*.name, 'demo:failure')
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust (with clippy and rustfmt)
        uses: dtolnay/rust-toolchain@1.88
        with:
          components: clippy, rustfmt

      - name: Introduce a deliberate clippy warning
        shell: pwsh
        run: |
          Set-Content src-tauri\src\main.rs @'
          fn main() {
              let unused = 1 + 1;
          }
          '@

      - name: Expect cargo clippy -- -D warnings to fail
        shell: pwsh
        working-directory: src-tauri
        run: |
          cargo clippy -- -D warnings
          $code = $LASTEXITCODE
          if ($code -eq 0) {
            Write-Output "clippy passed on code that should trigger a warning - the gate is not enforcing"
            exit 1
          }
          Write-Output "clippy failed as expected (exit $code)"
          exit 0

      - name: Introduce deliberately unformatted code
        shell: pwsh
        run: |
          Set-Content src-tauri\src\main.rs @'
          fn main() {
          let x=1;
          }
          '@

      - name: Expect cargo fmt --check to fail
        shell: pwsh
        working-directory: src-tauri
        run: |
          cargo fmt --check
          $code = $LASTEXITCODE
          if ($code -eq 0) {
            Write-Output "fmt --check passed on unformatted code - the gate is not enforcing"
            exit 1
          }
          Write-Output "fmt --check failed as expected (exit $code)"
          exit 0

      # The "Expect" steps pass only when the corresponding gate fails on the
      # broken code, so the real gate output appears in the log. If a gate
      # that should catch does not, the step fails and this job shows red.
