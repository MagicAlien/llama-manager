# llama.cpp Manager — CI
#
# T-000: the six gates. `windows-latest` ships Rust, Node and the MSVC build
# tools (docs/DEV-SETUP.md §CI), so nothing is installed beyond the rustfmt
# and clippy components and cached dependencies.
#
# `jobs.gates` is deliberately reusable: later tasks add steps to it (T-002
# adds the type-generation freshness check) rather than forking the workflow.
#
# `jobs.demo-failure` proves the gates' red path on demand: label a PR
# `demo:failure` and the same six commands run against a deliberately broken
# tree, expecting every one of them to fail. It never runs otherwise.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  RUST_BACKTRACE: 1

jobs:
  gates:
    name: Build, test, lint
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust (with clippy and rustfmt)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('src-tauri/Cargo.toml', 'src-tauri/Cargo.lock') }}

      - name: Cache npm
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('package-lock.json') }}

      # Rust gates -----------------------------------------------------------
      - name: cargo fmt --check
        run: cargo fmt --check
        working-directory: src-tauri

      - name: cargo build
        run: cargo build
        working-directory: src-tauri

      - name: cargo clippy -- -D warnings
        run: cargo clippy -- -D warnings
        working-directory: src-tauri

      - name: cargo test
        run: cargo test
        working-directory: src-tauri

      # JavaScript gates -----------------------------------------------------
      - name: npm ci
        run: npm ci

      - name: npm run lint
        run: npm run lint

      - name: npm run test
        run: npm run test

  demo-failure:
    name: Demonstrate the gates fail (label demo:failure)
    if: contains(github.event.pull_request.labels.*.name, 'demo:failure')
    runs-on: windows-latest
    timeout-minutes: 30
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust (with clippy and rustfmt)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Introduce a deliberate clippy warning
        shell: pwsh
        run: |
          Set-Content src-tauri\src\main.rs @'
          fn main() {
              let unused = 1 + 1;
          }
          '@

      - name: Expect cargo clippy -- -D warnings to fail
        shell: pwsh
        working-directory: src-tauri
        run: |
          cargo clippy -- -D warnings
          if ($LASTEXITCODE -eq 0) {
            Write-Error "clippy passed on code that should trigger a warning - the gate is not enforcing"
            exit 1
          }
          Write-Output "clippy failed as expected (exit $LASTEXITCODE)"

      - name: Introduce deliberately unformatted code
        shell: pwsh
        run: |
          Set-Content src-tauri\src\main.rs @'
          fn main() {
          let x=1;
          }
          '@

      - name: Expect cargo fmt --check to fail
        shell: pwsh
        working-directory: src-tauri
        run: |
          cargo fmt --check
          if ($LASTEXITCODE -eq 0) {
            Write-Error "fmt --check passed on unformatted code - the gate is not enforcing"
            exit 1
          }
          Write-Output "fmt --check failed as expected (exit $LASTEXITCODE)"

      # The job is continue-on-error, so the workflow reports success while the
      # two "Expect" steps above show the real, failing gate output in the log.
      # If either expectation fails (a gate that should catch did not),
      # this job shows red and the demo has caught a broken gate instead.
