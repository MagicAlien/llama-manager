[package]
name = "llama-manager"
version = "0.0.0"
edition = "2021"
publish = false

# T-001 scaffold crate: replaces T-000's bootstrap outright. Only what the
# scaffold itself needs — no core/, ipc/ or db/ dependency belongs here
# until the task that adds that module (PLAN.md §3).
#
# T-002 adds core/types.rs (docs/CONTRACTS.md §1) and with it: serde,
# serde_json, thiserror (approved, PLAN.md §3) and ts-rs (approved, PLAN.md
# §3, ADR-001). chrono is NOT in PLAN.md §3's approved list; CONTRACTS.md §1
# nonetheless declares every timestamp field as `DateTime<Utc>`, which has no
# std alternative. Added and justified per AGENTS.md §4 — see this PR's
# Dependencies section and PROGRESS.md D-007.
[dependencies]
tauri = { version = "2", features = [] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"
# chrono-impl: CONTRACTS.md §1 types carry DateTime<Utc> fields throughout.
# serde-json-impl deliberately NOT enabled: ServerProps.raw uses
# #[ts(type = "unknown")] instead (core/types.rs), so ts-rs never needs its
# own binding for serde_json::Value — see the comment on that field for why.
ts-rs = { version = "12", features = ["chrono-impl"] }
# T-003 (docs/CONTRACTS.md §3, db/): SQLite via rusqlite (bundled), the
# crate PLAN.md §3's "Approved Rust crates" list names for this — not
# re-justified here, and sqlx / any other driver is not added, per the
# task's own instruction not to reopen that choice. "bundled" links a
# vendored SQLite instead of requiring one on the build machine, matching
# `docs/DEV-SETUP.md`'s "no toolchain component beyond Rust + MSVC" story.
rusqlite = { version = "0.32", features = ["bundled"] }
# T-010 (docs/CONTRACTS.md §6, core/env_probe.rs): GPU access via NVML.
# Approved, PLAN.md §3 ("GPU telemetry" row). Version is this session's
# best guess (no Rust toolchain to let `cargo add` resolve it for real,
# see PROGRESS.md) — treat as unverified until a real `cargo build` runs.
nvml-wrapper = "0.10"
# T-010: system RAM, free disk space and the OS build string have no std
# API on Windows. `windows` is already approved (PLAN.md §3), scoped in
# that list's own parenthetical to "DPAPI, junctions" — this task uses it
# for the first time beyond that scope, justified per AGENTS.md §4 the same
# way chrono was in T-002 (PROGRESS.md D-008): the crate itself is already
# approved, and there is no alternative on this platform. Feature list and
# exact version are also this session's best guess, same caveat as above.
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_System_SystemInformation",
    "Win32_Storage_FileSystem",
    "Win32_System_Registry",
]}
reqwest = { version = "0.13.4", default-features = false, features = ["json", "rustls"] }
# T-022 (docs/TASKS.md, core/installer.rs): archive extraction, SHA-256 and
# test scratch directories. All three are on PLAN.md §3's approved list —
# not re-justified here.
#
# T-023: `default-features = false` alone leaves the zip crate unable to
# decompress *deflate* (method 8) archives — the only compression every real
# llama.cpp release asset uses. T-022's tests wrote stored (method 0) zips via
# `FileOptions::default()`, so the gap was invisible; the first real install
# (b9196) failed with "Compression method not supported". Enable just the
# `deflate` feature (flate2 backend + zopfli) — not the full default set, so
# bzip2/lzma/zstd/xz/aes stay out of the dependency tree.
zip = { version = "2", default-features = false, features = ["deflate"] }
sha2 = "0.10"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dev-dependencies]
tokio = { version = "1.53.1", features = ["rt", "macros"] }
# T-021 (docs/TASKS.md, core/backend_selection.rs): the property test over
# hardware profiles. Approved, PLAN.md §3 (both the "Rust tests" row and the
# "Approved Rust crates" list name it) — not re-justified here.
proptest = "1"
# T-022: scratch directories for installer tests (per PLAN.md §3's dev-dep
# note).
tempfile = "3"
